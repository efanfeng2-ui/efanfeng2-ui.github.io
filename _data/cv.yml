    Research Experience:
      - company: Virginia Tech — Department of Entomology & Fralin Life Sciences Institute
        position: Graduate Research Assistant
        start_date: 2022-01
        end_date: present
        location: Blacksburg, VA
        highlights:
          - Prepared **Hi-C libraries** for mosquito genome and structural variation studies; coordinated sequencing requirements, sample metadata, and data delivery with sequencing providers.
          - Contributed to a **haplotype-resolved *Aedes albopictus* genome assembly** integrating **trio-binning**, **Nanopore long reads**, **Hi-C scaffolding**, and **FISH** physical validation; first author of the manuscript in preparation.
          - Designed and validated **PCR breakpoint assays** to genotype chromosomal inversions across natural populations, linking structural variants to climatic adaptation and vector traits.
          - Conducted population genomic analyses (**FST, PCA, AMOVA**) to quantify differentiation and gene flow among *Culex pipiens* populations across North America.
          - Performed molecular dissections, DNA extraction, and fluorescence microscopy imaging; maintained mosquito colonies and coordinated laboratory safety inspection responses.
          - Mentored two undergraduate researchers in mosquito dissection, FISH probe preparation, and PCR optimization and troubleshooting for mosquito identification and population studies.
          - Contributed to the international *Aedes aegypti* inversion study published in *Genome Biology and Evolution*.
          - Prepared research summaries and FISH figures for an NIH grant progress report, incorporating feedback from the principal investigator.

