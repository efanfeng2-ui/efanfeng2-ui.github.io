    Research Experience:
      - company: Virginia Tech — Department of Entomology & Fralin Life Sciences Institute
        position: Graduate Research Assistant
        start_date: 2021-08
        end_date: present
        location: Blacksburg, VA
        highlights:
          - Led multi-species genomic projects integrating **Hi-C scaffolding**, **Nanopore long-read sequencing**, and **FISH cytogenetic mapping** to assemble chromosome-scale mosquito genomes.
          - Designed and validated **PCR breakpoint assays** to genotype chromosomal inversions across natural populations, linking structural variants to climatic adaptation and vector traits.
          - Conducted population genomic analyses (**FST, PCA, AMOVA**) to quantify differentiation and gene flow among *Culex pipiens* populations across North America.
          - Performed molecular dissections, DNA extraction, library preparation, and fluorescence microscopy imaging; maintained mosquito colonies.
          - Mentored two undergraduate researchers in PCR optimization, experimental design, and scientific writing.
          - Coordinated with collaborating groups across nine countries on the *Aedes aegypti* inversion study published in *Genome Biology and Evolution*.

      - company: Virginia Tech — Department of Food Science and Technology
